version: '3.8'

services:
  web:
    build: .
    container_name: royal_barber_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://royal_user:royal_password@db:5432/royal_barber_db
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: royal_barber_db
    environment:
      - POSTGRES_DB=royal_barber_db
      - POSTGRES_USER=royal_user
      - POSTGRES_PASSWORD=royal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always

  nginx:
    image: nginx:alpine
    container_name: royal_barber_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
