{% extends 'base.html' %}
{% block title %}Bronni bekor qilish{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
    <h1 class="font-display text-2xl text-white mb-4">
        "{{ object.service.name }}" ({{ object.date }} {{ object.start_time }}) bronini bekor qilmoqchimisiz?
    </h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white font-semibold px-6 py-3 rounded-lg hover:bg-red-700 transition mr-4">
            Ha, bekor qilish
        </button>
        <a href="{% url 'bookings:my_bookings' %}" class="text-gray-400 hover:text-gold-500">Ortga qaytish</a>
    </form>
</section>
{% endblock %}
